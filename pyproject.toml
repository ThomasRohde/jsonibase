[project]
name = "jsonibase"
dynamic = ["version"]
description = "Typed JSONL records with SQLite, FTS5, and built-in local embeddings."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Thomas Klok Rohde" }
]
keywords = [
  "jsonl",
  "sqlite",
  "fts5",
  "search",
  "local-first",
  "embeddings",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2",
  "orjson>=3",
  "portalocker>=2",
  "numpy>=2",
  "model2vec>=0.3",
]

[project.optional-dependencies]
cli = [
  "typer>=0.12",
  "rich>=13",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "pytest-benchmark>=4",
  "ruff>=0.6",
  "pyright>=1.1",
  "build>=1",
  "twine>=5",
]

[project.scripts]
jsonibase = "jsonibase.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jsonibase/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonibase"]
include = [
  "src/jsonibase/py.typed",
  "src/jsonibase/models/potion-base-8M/**",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C4",
  "PIE",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/jsonibase/cli/main.py" = ["B008"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
